name: OSHA Data Refresh

on:
  workflow_dispatch:

jobs:
  build-osha-db:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test OSHA Accident Endpoint
        run: |
          python - <<'EOF'
          import requests
      
          url = "https://apiprod.dol.gov/v4/get/OSHA/accident/json"
      
          r = requests.get(url)
      
          print("STATUS:", r.status_code)
          print(r.text[:3000])
          EOF

      - name: Inspect OSHA Dataset new
        run: |
          python - <<'EOF'
          import requests
          import json
      
          r = requests.get(
              "https://apiprod.dol.gov/v4/datasets"
          )
      
          for d in r.json()["datasets"]:
              if d.get("id") == 10331:
                  print(json.dumps(d, indent=2))
          EOF

      - name: Find OSHA Datasets
        run: |
          python - <<'EOF'
          import requests
      
          r = requests.get("https://apiprod.dol.gov/v4/datasets")
          datasets = r.json()["datasets"]
      
          for d in datasets:
              name = str(d.get("name",""))
              table = str(d.get("tablename",""))
      
              if any(x in (name + table).lower() for x in [
                  "osha",
                  "inspection",
                  "violation",
                  "accident",
                  "enforcement"
              ]):
                      print("="*80)
                      print("ID:", d.get("id"))
                      print("NAME:", name)
                      print("TABLE:", table)
          EOF
          
      - name: Debug DOL Page
        run: |
          python - <<'EOF'
          import requests
      
          r = requests.post(
              "https://enforcedata.dol.gov/views/data_summary.php",
              data={"agency":"osha"}
          )
      
          print("Status:", r.status_code)
          print("Final URL:", r.url)
          print(r.text[:5000])
          EOF

      - name: Test DOL v4 Dataset API
        run: |
          python - <<'EOF'
          import requests
          import json
      
          url = "https://apiprod.dol.gov/v4/datasets"
      
          r = requests.get(url)
      
          print("STATUS:", r.status_code)
          print("CONTENT-TYPE:", r.headers.get("content-type"))
          print(r.text[:2000])
          EOF
          
      - name: Test OSHA ZIP Download
        run: |
          python - <<'EOF'
          import requests
      
          url = "https://enfxfr.dol.gov/data_catalog/OSHA/osha_inspection_20250601.csv.zip"
      
          r = requests.get(url, allow_redirects=True)
      
          print("STATUS:", r.status_code)
          print("FINAL URL:", r.url)
          print("CONTENT_LENGTH:", len(r.content))
          EOF
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download OSHA Data
        run: |
          make collect

      - name: Build Compiled Database
        run: |
          make compile_db

      - name: Build Wrangled Database
        run: |
          make wrangle_db

      - name: Verify Database Exists
        run: |
          ls -lah data/wrangled/

      - name: Upload SQLite Artifact
        uses: actions/upload-artifact@v4
        with:
          name: osha-wrangled-db
          path: data/wrangled/osha_wrangled.sqlite
