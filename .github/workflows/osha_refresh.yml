name: OSHA Data Refresh

on:
  workflow_dispatch:

jobs:
  build-osha-db:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug DOL Page
        run: |
          python - <<'EOF'
          import requests
      
          r = requests.post(
              "https://enforcedata.dol.gov/views/data_summary.php",
              data={"agency":"osha"}
          )
      
          print("Status:", r.status_code)
          print("Final URL:", r.url)
          print(r.text[:5000])
          EOF

      - name: Test OSHA Data URL
        run: |
          python - <<'EOF'
          import requests
      
          url = "https://enfxfr.dol.gov/data_catalog/OSHA/"
      
          r = requests.get(url, allow_redirects=True)
      
          print("STATUS:", r.status_code)
          print("FINAL URL:", r.url)
          print(r.text[:1000])
          EOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download OSHA Data
        run: |
          make collect

      - name: Build Compiled Database
        run: |
          make compile_db

      - name: Build Wrangled Database
        run: |
          make wrangle_db

      - name: Verify Database Exists
        run: |
          ls -lah data/wrangled/

      - name: Upload SQLite Artifact
        uses: actions/upload-artifact@v4
        with:
          name: osha-wrangled-db
          path: data/wrangled/osha_wrangled.sqlite
